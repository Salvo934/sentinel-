<h2>Conferma il tuo indirizzo email</h2>
<p>Hai creato un account su NIS2 Control. Per attivarlo, conferma il tuo indirizzo email:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard">
    Conferma email
  </a>
</p>
<p>Se non hai richiesto la registrazione, ignora questo messaggio.</p>
